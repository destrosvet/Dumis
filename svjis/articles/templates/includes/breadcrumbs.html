{% load i18n %}
{% if breadcrumbs %}
<nav class="breadcrumbs" aria-label="{% translate 'Breadcrumb' %}">
    <ol class="breadcrumbs__list">
        {% for crumb in breadcrumbs %}
            {% if crumb.url %}
            <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="{{ crumb.url }}">{{ crumb.label }}</a></li>
            {% else %}
            <li class="breadcrumbs__item breadcrumbs__item--current" aria-current="page">{{ crumb.label }}</li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
{% endif %}
