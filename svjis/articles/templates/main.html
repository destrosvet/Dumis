{% extends "base-with-aside-menu.html" %}

{% load vite %}

{% block hero %}
{% if is_homepage and company_picture %}
<section class="hero" style="background-image: url('/media/{{ company_picture }}');">
    <div class="hero__overlay"></div>
    <div class="hero__inner">
        <div class="hero__badge">
            <h1 class="hero__title">{{ company_name|default:"SVJIS2" }}</h1>
        </div>
    </div>
</section>
{% endif %}
{% endblock hero %}

{% block cnt %}

<div id="homepage-root" style="display: contents;" data-initial-menu="{{ menu_id|default:'' }}"></div>
{% vite_css 'js/homepage/index.jsx' %}
<script type="module" src="{% vite_asset 'js/homepage/index.jsx' %}"></script>

{% endblock cnt %}
