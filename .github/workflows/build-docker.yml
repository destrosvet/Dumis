name: Build Docker Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build-docker.yml'
      - '.dockerignore'
      - 'docker-compose.yaml'
      - 'Dockerfile'
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7.0.0

      - name: Build docker image
        run: |
          docker build -t destrosvet/dumis:latest .

      - name: Create directories and files
        run: |
          mkdir -p ./svjis2-data/static
          mkdir -p ./svjis2-data/media
          echo "DATABASES = {'default': {'ENGINE': 'django.db.backends.postgresql','NAME': 'svjis_db','USER': 'svjis_user','PASSWORD': 'change-it','HOST': 'svjis-db','PORT': '5432',}}" > ./svjis2-data/local_settings.py
          chmod -R ugo+rwx ./svjis2-data

      - name: Start docker compose
        run: |
          docker compose up -d
          sleep 5  # Wait for migrations to be finished

      - name: Run basic parametrization
        run: |
          docker exec svjis2_app bash -c "python svjis/manage.py svjis_setup --password changeIt"

      - name: Test if application is running
        run: |
          string="Smlouvy"
          if curl -s "http://localhost:8000" | grep -q "$string"; then
              echo "'$string' found"
          else
              echo "'$string' not found"
              exit 1
          fi

      - name: Stop docker compose
        if: always()
        run: |
          docker compose down

      - name: Push to Docker Hub
        # Pushes :latest on every push to master, plus a version tag when a v* tag was pushed.
        # Skipped for pull_request/workflow_dispatch runs, which only build and smoke-test.
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker login --username "$DOCKERHUB_USERNAME" --password "$DOCKERHUB_TOKEN"
          docker push destrosvet/dumis:latest
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
            docker tag destrosvet/dumis:latest destrosvet/dumis:$TAG
            docker push destrosvet/dumis:$TAG
          fi
